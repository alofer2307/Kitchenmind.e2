name: Platform validation
on:
  push:
    branches:
      - feat/platform-gestion-empresas-escalable
  pull_request:
    paths:
      - 'components/platform/**'
      - 'repositories/d1-tenancy.repository.ts'
      - 'services/tenancy.service.ts'
      - 'app/api/platform/tenancy/route.ts'
      - 'tests/**'
      - '.github/workflows/platform-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.1'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
